name: Auto-refresh schedule data

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-schedule
  cancel-in-progress: true

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schedule scraper
        run: python scripts/scrape_cba_schedule.py

      - name: Validate generated data
        run: node scripts/doctor.mjs --strict

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          if git diff --cached --quiet; then
            echo "No changes to schedule.json"
          else
            git commit -m "chore: auto-refresh schedule data"
            git push
          fi
